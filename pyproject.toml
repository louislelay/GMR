[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "general_motion_retargeting"
version = "0.2.0"
description = "General Motion Retargeting (GMR) for Humanoid Robots"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yanjie Ze", email = "lastyanjieze@gmail.com" },
]
requires-python = ">=3.10.12,<3.14"
dependencies = [
    "mink",
    "mujoco",
    "numpy",
    "scipy",
    "torch",
    "rich",
    "imageio[ffmpeg]",
    "pydantic>=2.11",
    "mujoco-menagerie==2026.9.0",
    "mjviser>=0.0.14",
    "viser>=1.0",
    "smplx>=0.1.28",
]

[project.urls]
Repository = "https://github.com/YanjieZe/GMR"

[project.scripts]
retarget = "general_motion_retargeting.cli.retarget:main"
visualize = "general_motion_retargeting.cli.visualize:main"
stream = "general_motion_retargeting.cli.stream:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"general_motion_retargeting/__init__.py" = ["F401"]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["general_motion_retargeting"]
